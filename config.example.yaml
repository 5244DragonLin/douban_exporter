# ============================================================
# 豆瓣数据导出工具 - 示例配置文件
# ============================================================
# 用法：
#   python cli.py                        # 按 features 自动执行启用项
#   python cli.py books -c config.yaml   # 读书列表（已读/想读/在读）
#   python cli.py reviews -c config.yaml # 书评
#   python cli.py notes -c config.yaml   # 读书笔记
#   python cli.py movies -c config.yaml  # 观影记录
#   python cli.py games -c config.yaml   # 游戏记录
#   python cli.py music -c config.yaml   # 音乐记录
#
# 结构说明：按功能分层，只需填写你需要的部分。
# 键名遵循《爬虫项目指南》统一规范。
# ============================================================

# ---- 功能开关（features，置顶）----
# 控制各功能是否启用：true=启用，false=禁止。
# 直接运行（不带子命令）时，自动执行这里启用的功能。
features:
  books: true        # 读书列表抓取（已读/想读/在读）
  reviews: false     # 书评抓取（reviews 子命令，纯标准库 + Cookie）
  notes: true        # 读书笔记（标注）抓取（notes 子命令）
  movies: true       # 观影记录导出（看过/想看/在看）
  games: true        # 游戏记录导出（玩过/想玩/在玩）
  music: true        # 音乐记录导出（听过/想听/在听）

# ---- 认证（auth 节）----
# cookie: 豆瓣登录 Cookie（浏览器控制台 document.cookie 复制）。
#         用于抓取个人标签/书评全文，留空则匿名抓取。
# cookie_file: 也可将 Cookie 存到文件（与 cookie 二选一，文件优先级更高）。
auth:
  # cookie: ""
  cookie_file: "cookie.txt"

# ---- 用户信息（user 节，仅业务字段）----
user:
  id: "YOUR_ID"

# ---- 书评抓取（reviews）----
# output_dir: 输出目录（含 md/ html/ 子目录）
# format: md / html / both（默认 both）
# limit: 限制抓取篇数（可选）
reviews:
  output_dir: "douban_reviews_output"
  format: "both"
  incremental: true  # 增量模式：已有文件去重追加

# ---- 读书列表抓取（books）----
books:
  output_dir: "douban_books_output"
  incremental: true
  types:
    - collect    # 已读
    - wish       # 想读
    - do         # 在读

# ---- 读书笔记（notes）----
# 输出固定为 Markdown：按书名生成 {书名}.md
notes:
  output_dir: "douban_notes_output"
  incremental: true
  # limit: 30    # 可选：限制抓取笔记条数

# ---- 观影记录导出（movies）----
movies:
  output_dir: "douban_movies_output"
  incremental: true
  statuses:
    - collect    # 看过
    - wish       # 想看
    - do         # 在看

# ---- 游戏记录导出（games）----
games:
  output_dir: "douban_games_output"
  incremental: true
  statuses:
    - collect    # 玩过
    - wish       # 想玩
    - do         # 在玩

# ---- 音乐记录导出（music）----
music:
  output_dir: "douban_music_output"
  incremental: true
  statuses:
    - collect    # 听过
    - wish       # 想听
    - do         # 在听
